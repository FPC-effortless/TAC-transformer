name: Research CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'tac_transformer/**'
      - 'tac_sie/**'
      - 'tac_osm/**'
      - 'kaggle/**'
      - 'experiments/**'
      - 'tests/**'
      - 'tests_py/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - 'tac_transformer/**'
      - 'tac_sie/**'
      - 'kaggle/**'
      - 'experiments/**'
      - 'tests/**'
      - 'tests_py/**'
      - 'requirements.txt'
      - 'pyproject.toml'
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: research-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-core:
    name: Python core smoke
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest torch numpy
          python -m pip install -r requirements.txt

      - name: Import smoke
        run: |
          python - <<'PY'
          import tac_transformer
          import tac_transformer.core
          import tac_transformer.memory
          import tac_transformer.routing
          import tac_sie
          print('imports ok')
          PY

      - name: Core tests
        run: |
          python -m unittest \
            tests_py.test_tac_transformer \
            tests_py.test_tac_serving \
            tests_py.test_facades

  tac-scm:
    name: TAC-SCM benchmark tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: TAC-SCM unit benchmark tests
        run: |
          python -m unittest \
            tests_py.test_tac_scm_real004 \
            tests_py.test_tac_scm_real005 \
            tests_py.test_tac_scm_real006 \
            tests_py.test_tac_scm_real011 \
            tests_py.test_tac_scm_real017_audit

  tac-sie:
    name: TAC-SIE scaffold tests
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: TAC-SIE pytest suite
        run: |
          python -m pytest \
            tests/test_memory_shapes.py \
            tests/test_key_separation_loss.py \
            tests/test_query_key_alignment.py \
            tests/test_executor_pretrain.py \
            tests/test_exp009_smoke.py \
            tests/test_exp009b_smoke.py

  docs-guardrails:
    name: Evidence docs guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Required research docs exist
        run: |
          test -f EVIDENCE_AUDIT.md
          test -f LIMITATIONS.md
          test -f REPRODUCIBILITY.md
          test -f TECHNICAL_REPORT.md
          test -f RESULTS_SUMMARY.md
          test -f docs/REAL017_AUDIT.md

      - name: Guard against promoting REAL017 as validated
        run: |
          python - <<'PY'
          from pathlib import Path

          needle = "REAL017 validates verifier-guided structure repair"
          excluded = {
              Path("docs/REAL017_AUDIT.md"),
              Path(".github/workflows/research-ci.yml"),
          }
          hits = []
          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts or path in excluded:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              if needle in text:
                  hits.append(str(path))

          if hits:
              print("REAL017 promotion text found in protected files:")
              print("\n".join(hits))
              raise SystemExit(1)
          PY

  tac-osm-v04-full:
    name: TAC-OSM v0.4 full falsification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch numpy
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi

      - name: Run 4-seed x 4-cell benchmark
        run: |
          mkdir -p artifacts
          python -m tac_osm.experiment_v04 \
            --seeds 0,1,2,3 \
            --steps 300 \
            --batch 128 \
            --device cpu | tee artifacts/tac_osm_v04_full.json

      - name: Upload benchmark record
        uses: actions/upload-artifact@v4
        with:
          name: tac-osm-v04-full
          path: artifacts/tac_osm_v04_full.json
