name: TAC-OSM v0.4 full falsification

on:
  push:
    branches: [feat/tac-osm-v0.1]
  workflow_dispatch:

jobs:
  v04-full:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch numpy
          if [ -f requirements.txt ]; then python -m pip install -r requirements.txt; fi
      - name: Run 4-seed x 4-cell benchmark
        run: |
          mkdir -p artifacts
          python -m tac_osm.experiment_v04 \
            --seeds 0,1,2,3 \
            --steps 300 \
            --batch 128 \
            --device cpu | tee artifacts/tac_osm_v04_full.json
      - name: Upload benchmark record
        uses: actions/upload-artifact@v4
        with:
          name: tac-osm-v04-full
          path: artifacts/tac_osm_v04_full.json
